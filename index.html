<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lean Factory Live</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

h1 { color: #22c55e; }

.section {
    margin: 30px;
    padding: 20px;
    border-radius: 10px;
    background: #1e293b;
}

button {
    padding: 10px 20px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.muda {
    background: crimson;
}

.good {
    background: #22c55e;
}

#factory {
    margin-top: 20px;
    padding: 20px;
    background: #334155;
    border-radius: 10px;
}

</style>
</head>

<body>

<h1>🏭 Lean Factory Live</h1>
<p>Transforme une usine inefficace en système Lean</p>

<!-- ETAPE 1 -->
<div class="section">
<h2>🔍 Étape 1 : Chasse aux Mudas</h2>

<button class="muda" onclick="removeMuda(this)">Stock excessif</button>
<button class="muda" onclick="removeMuda(this)">Transport inutile</button>
<button class="muda" onclick="removeMuda(this)">Attente</button>
<button class="muda" onclick="removeMuda(this)">Surproduction</button>

<p>Lead Time réduit : <span id="lead">0</span>%</p>
</div>

<!-- ETAPE 2 -->
<div class="section">
<h2>⚙️ Étape 2 : Choix du Flux</h2>

<button onclick="pushFlow()">Flux Poussé</button>
<button onclick="pullFlow()">Flux Tiré (Lean)</button>

<div id="factory">Usine en attente...</div>
</div>

<!-- ETAPE 3 -->
<div class="section">
<h2>🚀 Étape 3 : Lean 4.0</h2>

<button onclick="digitalize()">Activer Digitalisation</button>

<p>Performance : <span id="perf">0</span>%</p>
</div>

<script>
let lead = 0;
let perf = 0;

function removeMuda(btn) {
    btn.style.display = "none";
    lead += 10;
    document.getElementById("lead").innerText = lead;
}

function pushFlow() {
    document.getElementById("factory").innerHTML =
    "❌ Stock accumulé ❌<br>❌ Désordre ❌<br>Effet Bullwhip !";
}

function pullFlow() {
    document.getElementById("factory").innerHTML =
    "✅ Commande client reçue<br>📦 Kanban activé<br>Flux fluide !";
}

function digitalize() {
    perf += 30;
    document.getElementById("perf").innerText = perf;

    document.getElementById("factory").innerHTML +=
    "<br>📡 e-Kanban actif<br>📊 VSM digitale<br>🌱 Green Lean activé";
}
</script>

</body>
</html>
