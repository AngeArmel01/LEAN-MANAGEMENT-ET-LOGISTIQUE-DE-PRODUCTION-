<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lean Flow Experience</title>

<style>
body {
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1 { margin:20px; }

#line {
    position:relative;
    height:200px;
    margin:40px;
    border-top:4px solid #22c55e;
}

.stage {
    position:absolute;
    top:-40px;
    width:25%;
    text-align:center;
}

#p1 { left:0%; }
#p2 { left:25%; }
#p3 { left:50%; }
#p4 { left:75%; }

.box {
    position:absolute;
    top:80px;
    font-size:28px;
    transition: all linear;
}

button {
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>🚀 Lean Flow Experience</h1>

<div id="line">
    <div id="p1" class="stage">🏭 Production</div>
    <div id="p2" class="stage">⚙️ Process</div>
    <div id="p3" class="stage">🚚 Livraison</div>
    <div id="p4" class="stage">🏠 Client</div>
</div>

<button onclick="startPush()">❌ Flux poussé</button>
<button onclick="startLean()">✅ Flux Lean</button>

<script>
let interval;

function createBox(speed) {
    let box = document.createElement("div");
    box.className = "box";
    box.innerText = "📦";

    document.getElementById("line").appendChild(box);

    let pos = 0;

    let move = setInterval(() => {
        pos += speed;
        box.style.left = pos + "%";

        // blocage en mode chaos
        if(pos > 40 && Math.random() < 0.3){
            speed = 0;
        }

        if(pos >= 90){
            clearInterval(move);
            box.remove();
        }
    }, 50);
}

// MODE CHAOS
function startPush(){
    clearInterval(interval);
    interval = setInterval(() => createBox(0.5), 300);
}

// MODE LEAN
function startLean(){
    clearInterval(interval);
    interval = setInterval(() => createBox(1.5), 1200);
}
</script>

</body>
</html>
