<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lean World Explorer</title>

<style>
body {
    margin:0;
    overflow:hidden;
    background:#0f172a;
    color:white;
    font-family:sans-serif;
}

/* Carte */
#map {
    position:relative;
    width:2000px;
    height:1000px;
    background:#1e293b;
}

/* Joueur */
#player {
    position:absolute;
    width:40px;
    height:40px;
    font-size:30px;
}

/* Zones */
.zone {
    position:absolute;
    text-align:center;
}

.icon {
    font-size:40px;
}

/* Info */
#info {
    position:fixed;
    bottom:0;
    width:100%;
    background:black;
    padding:10px;
}
</style>
</head>

<body>

<div id="map">

<div id="player">🚗</div>

<div class="zone" style="left:200px; top:200px;">
    <div class="icon">🏭</div>
    Production
</div>

<div class="zone" style="left:600px; top:300px;">
    <div class="icon">📦</div>
    Mudas
</div>

<div class="zone" style="left:1000px; top:400px;">
    <div class="icon">⚙️</div>
    Process Lean
</div>

<div class="zone" style="left:1400px; top:300px;">
    <div class="icon">🚚</div>
    Livraison
</div>

<div class="zone" style="left:1700px; top:200px;">
    <div class="icon">🏠</div>
    Client
</div>

</div>

<div id="info">Utilise les flèches pour explorer</div>

<script>
let player = document.getElementById("player");
let x = 100;
let y = 100;

function update(){
    player.style.left = x + "px";
    player.style.top = y + "px";
}

document.addEventListener("keydown", (e)=>{
    if(e.key === "ArrowRight") x += 20;
    if(e.key === "ArrowLeft") x -= 20;
    if(e.key === "ArrowUp") y -= 20;
    if(e.key === "ArrowDown") y += 20;

    checkZones();
    update();
});

function checkZones(){

    let info = document.getElementById("info");

    if(x > 150 && x < 300){
        info.innerText = "🏭 Production : création du produit";
    }
    else if(x > 550 && x < 700){
        info.innerText = "📦 Mudas : gaspillage (stocks, attentes...)";
    }
    else if(x > 950 && x < 1100){
        info.innerText = "⚙️ Lean : flux optimisé (Kanban, JAT)";
    }
    else if(x > 1350 && x < 1500){
        info.innerText = "🚚 Livraison : transport";
    }
    else if(x > 1650){
        info.innerText = "🏠 Client final : valeur livrée";
    }
}
</script>

</body>
</html>
